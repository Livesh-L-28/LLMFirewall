<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="iconBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#iconBg)" stroke="#1e293b" stroke-width="4" />

  <!-- Shield Group Centered -->
  <g transform="translate(256, 256)">
    <!-- Outer Glow -->
    <path d="M 0 -170 L 140 -110 C 140 50 70 145 0 185 C -70 145 -140 50 -140 -110 Z"
          fill="none" stroke="url(#shieldGrad)" stroke-width="12" filter="url(#glow)" opacity="0.5" />

    <!-- Outer Shield Stroke -->
    <path d="M 0 -170 L 140 -110 C 140 50 70 145 0 185 C -70 145 -140 50 -140 -110 Z"
          fill="#090d16" stroke="url(#shieldGrad)" stroke-width="8" />

    <!-- Inner Shield Layer -->
    <path d="M 0 -135 L 110 -85 C 110 35 55 115 0 145 C -55 115 -110 35 -110 -85 Z"
          fill="url(#coreGlow)" stroke="#38bdf8" stroke-width="4" opacity="0.85" />

    <!-- Neural Network Node / Firewall Core inside Shield -->
    <g transform="translate(0, 10)">
      <!-- Center Core -->
      <circle cx="0" cy="0" r="22" fill="#00f0ff" filter="url(#glow)" />
      <circle cx="0" cy="0" r="14" fill="#ffffff" />

      <!-- Satellite Nodes -->
      <circle cx="-60" cy="-45" r="11" fill="#38bdf8" />
      <circle cx="60" cy="-45" r="11" fill="#38bdf8" />
      <circle cx="-48" cy="52" r="11" fill="#818cf8" />
      <circle cx="48" cy="52" r="11" fill="#818cf8" />

      <!-- Synaptic Connection Lines -->
      <line x1="0" y1="0" x2="-60" y2="-45" stroke="#00f0ff" stroke-width="5" opacity="0.85" />
      <line x1="0" y1="0" x2="60" y2="-45" stroke="#00f0ff" stroke-width="5" opacity="0.85" />
      <line x1="0" y1="0" x2="-48" y2="52" stroke="#818cf8" stroke-width="5" opacity="0.85" />
      <line x1="0" y1="0" x2="48" y2="52" stroke="#818cf8" stroke-width="5" opacity="0.85" />
      <line x1="-60" y1="-45" x2="60" y2="-45" stroke="#38bdf8" stroke-width="3" stroke-dasharray="5,6" opacity="0.6" />
      <line x1="-48" y1="52" x2="48" y2="52" stroke="#818cf8" stroke-width="3" stroke-dasharray="5,6" opacity="0.6" />
    </g>
  </g>
</svg>


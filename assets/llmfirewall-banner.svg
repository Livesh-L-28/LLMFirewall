<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Card Base -->
  <rect width="1200" height="320" rx="20" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Background Grid / Neural Dots -->
  <g opacity="0.12">
    <circle cx="100" cy="60" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="60" r="1.5" fill="#38bdf8" />
    <circle cx="300" cy="60" r="1.5" fill="#38bdf8" />
    <circle cx="100" cy="160" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="160" r="1.5" fill="#38bdf8" />
    <circle cx="300" cy="160" r="1.5" fill="#38bdf8" />
    <circle cx="100" cy="260" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="260" r="1.5" fill="#38bdf8" />
    <circle cx="300" cy="260" r="1.5" fill="#38bdf8" />
    <circle cx="1000" cy="60" r="1.5" fill="#38bdf8" />
    <circle cx="1100" cy="60" r="1.5" fill="#38bdf8" />
    <circle cx="1000" cy="160" r="1.5" fill="#38bdf8" />
    <circle cx="1100" cy="160" r="1.5" fill="#38bdf8" />
    <circle cx="1000" cy="260" r="1.5" fill="#38bdf8" />
    <circle cx="1100" cy="260" r="1.5" fill="#38bdf8" />
    <path d="M 60 250 L 160 150 L 260 150 L 320 90" stroke="url(#circuitGrad)" stroke-width="1.5" fill="none" />
    <path d="M 960 70 L 1040 150 L 1140 150" stroke="url(#circuitGrad)" stroke-width="1.5" fill="none" />
  </g>

  <!-- Shield Icon Group on Left -->
  <g transform="translate(100, 55)">
    <!-- Outer Glow -->
    <path d="M 90 18 L 165 48 C 165 120 125 165 90 182 C 55 165 15 120 15 48 Z"
          fill="none" stroke="url(#shieldGrad)" stroke-width="4.5" filter="url(#glow)" opacity="0.6" />

    <!-- Outer Shield Stroke -->
    <path d="M 90 18 L 165 48 C 165 120 125 165 90 182 C 55 165 15 120 15 48 Z"
          fill="#090d16" stroke="url(#shieldGrad)" stroke-width="3.5" />

    <!-- Inner Shield Layer -->
    <path d="M 90 38 L 148 62 C 148 114 116 148 90 162 C 64 148 32 114 32 62 Z"
          fill="url(#coreGlow)" stroke="#38bdf8" stroke-width="1.8" opacity="0.8" />

    <!-- Neural Network Node / Firewall Core inside Shield -->
    <g transform="translate(90, 98)">
      <!-- Center Core -->
      <circle cx="0" cy="0" r="10" fill="#00f0ff" filter="url(#glow)" />
      <circle cx="0" cy="0" r="6.5" fill="#ffffff" />

      <!-- Satellite Nodes -->
      <circle cx="-32" cy="-24" r="5" fill="#38bdf8" />
      <circle cx="32" cy="-24" r="5" fill="#38bdf8" />
      <circle cx="-25" cy="28" r="5" fill="#818cf8" />
      <circle cx="25" cy="28" r="5" fill="#818cf8" />

      <!-- Synaptic Connection Lines -->
      <line x1="0" y1="0" x2="-32" y2="-24" stroke="#00f0ff" stroke-width="2.2" opacity="0.85" />
      <line x1="0" y1="0" x2="32" y2="-24" stroke="#00f0ff" stroke-width="2.2" opacity="0.85" />
      <line x1="0" y1="0" x2="-25" y2="28" stroke="#818cf8" stroke-width="2.2" opacity="0.85" />
      <line x1="0" y1="0" x2="25" y2="28" stroke="#818cf8" stroke-width="2.2" opacity="0.85" />
      <line x1="-32" y1="-24" x2="32" y2="-24" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="2,3" opacity="0.5" />
      <line x1="-25" y1="28" x2="25" y2="28" stroke="#818cf8" stroke-width="1.4" stroke-dasharray="2,3" opacity="0.5" />
    </g>
  </g>

  <!-- Typography & Content -->
  <g transform="translate(320, 115)">
    <!-- Brand Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif"
          font-size="54" font-weight="800" letter-spacing="-0.8" fill="#ffffff">
      LLM<tspan fill="url(#shieldGrad)">Firewall</tspan><tspan fill="#94a3b8" font-size="34" font-weight="300" letter-spacing="1"> core</tspan>
    </text>

    <!-- Tagline -->
    <text y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif"
          font-size="20" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Security infrastructure for LLM-powered applications.
    </text>

    <!-- Sub-tagline -->
    <text y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif"
          font-size="14.5" font-weight="400" fill="#94a3b8">
      In-process guardrails, token-boundary stream filtering, tool call sandboxing &amp; RAG context quarantine.
    </text>

    <!-- Technical Badges Inside Banner -->
    <g transform="translate(0, 108)">
      <!-- Pill 1: Latency -->
      <rect x="0" y="0" width="165" height="30" rx="8" fill="#0f172a" stroke="#1e293b" />
      <circle cx="14" cy="15" r="4" fill="#10b981" />
      <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
        &lt; 0.20ms P50 Latency
      </text>

      <!-- Pill 2: Zero Deps -->
      <rect x="177" y="0" width="180" height="30" rx="8" fill="#0f172a" stroke="#1e293b" />
      <circle cx="191" cy="15" r="4" fill="#00f0ff" />
      <text x="203" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
        Zero Network / DB Deps
      </text>

      <!-- Pill 3: Policy-as-Code -->
      <rect x="369" y="0" width="185" height="30" rx="8" fill="#0f172a" stroke="#1e293b" />
      <circle cx="383" cy="15" r="4" fill="#8b5cf6" />
      <text x="395" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
        Policy-as-Code Enforced
      </text>

      <!-- Pill 4: Python Support -->
      <rect x="566" y="0" width="168" height="30" rx="8" fill="#0f172a" stroke="#1e293b" />
      <circle cx="580" cy="15" r="4" fill="#3b82f6" />
      <text x="592" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
        Python 3.9 – 3.13 Ready
      </text>
    </g>
  </g>
</svg>


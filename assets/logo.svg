<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Card Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Background Grid / Neural Dots -->
  <g opacity="0.12">
    <circle cx="80" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="160" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="240" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="320" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="80" cy="120" r="1.5" fill="#38bdf8" />
    <circle cx="160" cy="120" r="1.5" fill="#38bdf8" />
    <circle cx="240" cy="120" r="1.5" fill="#38bdf8" />
    <circle cx="320" cy="120" r="1.5" fill="#38bdf8" />
    <circle cx="80" cy="190" r="1.5" fill="#38bdf8" />
    <circle cx="160" cy="190" r="1.5" fill="#38bdf8" />
    <circle cx="240" cy="190" r="1.5" fill="#38bdf8" />
    <circle cx="320" cy="190" r="1.5" fill="#38bdf8" />
    <!-- Diagonal circuit line -->
    <path d="M 60 190 L 140 110 L 220 110 L 260 70" stroke="url(#circuitGrad)" stroke-width="1.5" fill="none" />
    <path d="M 720 50 L 780 110 L 840 110" stroke="url(#circuitGrad)" stroke-width="1.5" fill="none" />
  </g>

  <!-- Shield Icon Group -->
  <g transform="translate(68, 40)">
    <!-- Outer Glow -->
    <path d="M 80 15 L 145 42 C 145 105 110 145 80 160 C 50 145 15 105 15 42 Z"
          fill="none" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow)" opacity="0.6" />

    <!-- Outer Shield Stroke -->
    <path d="M 80 15 L 145 42 C 145 105 110 145 80 160 C 50 145 15 105 15 42 Z"
          fill="#090d16" stroke="url(#shieldGrad)" stroke-width="3" />

    <!-- Inner Shield Layer -->
    <path d="M 80 32 L 130 54 C 130 100 102 130 80 142 C 58 130 30 100 30 54 Z"
          fill="url(#coreGlow)" stroke="#38bdf8" stroke-width="1.5" opacity="0.75" />

    <!-- Neural Network Node / Firewall Core inside Shield -->
    <g transform="translate(80, 85)">
      <!-- Center Core -->
      <circle cx="0" cy="0" r="9" fill="#00f0ff" filter="url(#glow)" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />

      <!-- Satellites -->
      <circle cx="-28" cy="-20" r="4.5" fill="#38bdf8" />
      <circle cx="28" cy="-20" r="4.5" fill="#38bdf8" />
      <circle cx="-22" cy="24" r="4.5" fill="#818cf8" />
      <circle cx="22" cy="24" r="4.5" fill="#818cf8" />

      <!-- Synaptic Connection Lines -->
      <line x1="0" y1="0" x2="-28" y2="-20" stroke="#00f0ff" stroke-width="2" opacity="0.8" />
      <line x1="0" y1="0" x2="28" y2="-20" stroke="#00f0ff" stroke-width="2" opacity="0.8" />
      <line x1="0" y1="0" x2="-22" y2="24" stroke="#818cf8" stroke-width="2" opacity="0.8" />
      <line x1="0" y1="0" x2="22" y2="24" stroke="#818cf8" stroke-width="2" opacity="0.8" />
      <line x1="-28" y1="-20" x2="28" y2="-20" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.5" />
      <line x1="-22" y1="24" x2="22" y2="24" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.5" />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(265, 95)">
    <!-- Brand Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif"
          font-size="46" font-weight="800" letter-spacing="-0.5" fill="#ffffff">
      LLM<tspan fill="url(#shieldGrad)">Firewall</tspan><tspan fill="#94a3b8" font-size="28" font-weight="300" letter-spacing="1"> core</tspan>
    </text>

    <!-- Version & Tagline -->
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif"
          font-size="16.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      In-Process Defense-in-Depth Security &amp; Policy Enforcement for AI &amp; LLMs
    </text>

    <!-- Technical Badges Inside Banner -->
    <g transform="translate(0, 68)">
      <!-- Pill 1: Sub-Millisecond -->
      <rect x="0" y="0" width="158" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
      <circle cx="12" cy="13" r="3.5" fill="#10b981" />
      <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">
        &lt; 0.20ms P50 Latency
      </text>

      <!-- Pill 2: Zero Network Deps -->
      <rect x="168" y="0" width="168" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
      <circle cx="180" cy="13" r="3.5" fill="#00f0ff" />
      <text x="190" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">
        Zero Network / DB Deps
      </text>

      <!-- Pill 3: Deterministic Gating -->
      <rect x="346" y="0" width="186" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
      <circle cx="358" cy="13" r="3.5" fill="#8b5cf6" />
      <text x="368" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">
        Policy-as-Code Enforced
      </text>
    </g>
  </g>
</svg>

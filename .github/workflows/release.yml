name: Release & Distribution

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, Audit & Verify Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pin actions/checkout to v4.2.2 (11bd71901bbe5b1630ceea73d27597364c9af683)
      - name: Checkout Triggering Release Tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Enforce Release Tag Ancestry on Protected Main Branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "Resolving target commit for tag: ${RELEASE_TAG}"
          TAG_COMMIT=$(git rev-parse "${RELEASE_TAG}^{commit}" 2>/dev/null || true)
          if [ -z "$TAG_COMMIT" ]; then
              echo "ERROR: Unable to resolve release tag '${RELEASE_TAG}' to a valid commit."
              exit 1
          fi
          echo "Peeled tag commit SHA: ${TAG_COMMIT}"

          # Ensure origin/main is fetched and available to ancestry check
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
              echo "Fetching origin/main to verify release ancestry..."
              git fetch origin main:refs/remotes/origin/main --depth=0
          fi

          MAIN_COMMIT=$(git rev-parse origin/main)
          echo "Current origin/main commit SHA: ${MAIN_COMMIT}"

          # Verify ancestry: tag commit MUST be reachable from origin/main
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
              echo "=========================================================================="
              echo "CRITICAL RELEASE GOVERNANCE VIOLATION:"
              echo "Tag '${RELEASE_TAG}' (${TAG_COMMIT}) is NOT reachable from origin/main (${MAIN_COMMIT})."
              echo "Releases may ONLY be built and published from commits on the protected main branch."
              echo "=========================================================================="
              exit 1
          fi

          echo "Governance verification passed: tag '${RELEASE_TAG}' is an ancestor of origin/main."

      # Pin actions/setup-python to v5.4.0 (42375524e23c412d93fb67b49958b491fce71c38)
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Validate Stable SemVer Tag and pyproject.toml Metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "
          import os, re, sys, tomllib

          tag = os.environ.get('RELEASE_TAG', '')
          match = re.match(r'^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$', tag)
          if not match:
              print(f'ERROR: Invalid release tag \"{tag}\". Must strictly follow vMAJOR.MINOR.PATCH without prerelease or leading zeros.')
              sys.exit(1)

          expected_version = f'{match.group(1)}.{match.group(2)}.{match.group(3)}'

          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)

          project = data.get('project', {})
          name = project.get('name')
          version = project.get('version')

          if name != 'llmfirewall-core':
              print(f'ERROR: Expected package name \"llmfirewall-core\", got \"{name}\"')
              sys.exit(1)

          if version != expected_version:
              print(f'ERROR: pyproject.toml version \"{version}\" does not match tag version \"{expected_version}\"')
              sys.exit(1)

          print(f'Strict SemVer and pyproject.toml validated: {name} {version} (tag: {tag})')
          "

      - name: Install Quality and Build Dependencies
        run: |
          python -m pip install --upgrade pip build twine pytest pytest-asyncio ruff
          python -m pip install ".[dev]"

      - name: Run Full Linter Gate
        run: |
          ruff check src tests

      - name: Run Full Test Suite Gate
        run: |
          pytest -q

      - name: Build Isolated Release Distributions
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          python -m build --outdir dist-ci

      - name: Verify Exact Artifact Cardinality and Filenames
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_NAME="llmfirewall_core"
          EXPECTED_WHEEL="${PACKAGE_NAME}-${VERSION}-py3-none-any.whl"
          EXPECTED_SDIST="${PACKAGE_NAME}-${VERSION}.tar.gz"

          if [ ! -f "dist-ci/$EXPECTED_WHEEL" ]; then
              echo "ERROR: Expected wheel missing: dist-ci/$EXPECTED_WHEEL"
              exit 1
          fi
          if [ ! -f "dist-ci/$EXPECTED_SDIST" ]; then
              echo "ERROR: Expected sdist missing: dist-ci/$EXPECTED_SDIST"
              exit 1
          fi

          ACTUAL_ENTRIES=$(ls -1A dist-ci | sort)
          EXPECTED_ENTRIES=$(printf "%s\n%s" "$EXPECTED_SDIST" "$EXPECTED_WHEEL" | sort)
          if [ "$ACTUAL_ENTRIES" != "$EXPECTED_ENTRIES" ]; then
              echo "ERROR: Publishing directory contains unexpected entries!"
              echo "Expected strictly:"
              echo "$EXPECTED_ENTRIES"
              echo "Found:"
              echo "$ACTUAL_ENTRIES"
              exit 1
          fi
          echo "Cardinality verified: dist-ci contains strictly $EXPECTED_WHEEL and $EXPECTED_SDIST"

      - name: Validate Distribution Metadata with Twine
        run: |
          twine check dist-ci/*

      - name: Generate Checksum Manifest Outside Dist Directory
        run: |
          mkdir -p dist-manifest
          (cd dist-ci && sha256sum *.whl *.tar.gz > ../dist-manifest/SHA256SUMS.txt)
          echo "Generated SHA256SUMS.txt (logged without credentials):"
          cat dist-manifest/SHA256SUMS.txt

      # Pin actions/upload-artifact to v4.6.1 (4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1)
      - name: Upload Release Checksum Manifest Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: SHA256SUMS.txt
          path: dist-manifest/SHA256SUMS.txt
          retention-days: 5

      # Upload built distributions for the isolated publishing job
      - name: Upload Release Distributions Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-distributions
          path: dist-ci/
          retention-days: 1

      - name: Test Wheel in Isolated Virtualenv
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python -m venv venv_wheel
          . venv_wheel/bin/activate
          pip install "dist-ci/llmfirewall_core-${VERSION}-py3-none-any.whl"
          CLI_VER=$(llmfirewall --version)
          test "$CLI_VER" = "llmfirewall ${VERSION}"
          python -c "import llmfirewall; assert llmfirewall.__version__ == '${VERSION}'"
          python -c "
          from llmfirewall import Firewall, Action
          fw = Firewall()
          res_scan = fw.scan('Hello safe query')
          assert res_scan.action == Action.ALLOW and res_scan.is_allowed
          res_check = fw.check('Hello safe query')
          assert res_check.decision.action.value == 'allow'
          "
          deactivate
          rm -rf venv_wheel

      - name: Test Sdist in Isolated Virtualenv
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python -m venv venv_sdist
          . venv_sdist/bin/activate
          pip install "dist-ci/llmfirewall_core-${VERSION}.tar.gz"
          CLI_VER=$(llmfirewall --version)
          test "$CLI_VER" = "llmfirewall ${VERSION}"
          python -c "import llmfirewall; assert llmfirewall.__version__ == '${VERSION}'"
          python -c "
          from llmfirewall import Firewall, Action
          fw = Firewall()
          res_scan = fw.scan('Hello safe query')
          assert res_scan.action == Action.ALLOW and res_scan.is_allowed
          res_check = fw.check('Hello safe query')
          assert res_check.decision.action.value == 'allow'
          "
          deactivate
          rm -rf venv_sdist

  publish:
    name: Publish Release to PyPI
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llmfirewall-core
    permissions:
      contents: read
      id-token: write  # Least privilege: OIDC publication scope granted ONLY to publishing job
    steps:
      # Pin actions/download-artifact to v4.1.9 (cc203385981b70ca67e1cc392babf9cc229d5806)
      - name: Download Release Distributions
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-distributions
          path: dist-publish/

      - name: Download Checksum Manifest
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: SHA256SUMS.txt
          path: dist-manifest/

      - name: Verify Artifact Integrity Before Publishing
        run: |
          set -euo pipefail
          echo "Verifying SHA-256 checksums of distribution artifacts prior to PyPI publication:"
          (cd dist-publish && sha256sum -c ../dist-manifest/SHA256SUMS.txt)
          echo "Cryptographic integrity verified: dist-publish matches exact build output."

      # Pin pypa/gh-action-pypi-publish to v1.14.3 (7245906fb61fa33a13554f9d5fb856fe61758086)
      # Fail-closed: skip-existing removed to reject duplicate or partial uploads
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist-publish/

name: CI & Security Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,fastapi]"

      - name: Run Ruff Linting
        run: |
          ruff check src tests

      - name: Run Test Suite
        run: |
          pytest --cov=llmfirewall -v

      - name: Run Security Suite
        run: |
          pytest -m security -v

  build-and-verify:
    name: Build & Package Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build Wheel and Source Distribution
        run: |
          python -m build

      - name: Verify Package Metadata
        run: |
          twine check dist/*

      - name: Test Wheel in Clean Environment
        run: |
          python -m venv test_env
          . test_env/bin/activate
          pip install dist/*.whl
          python -c "import llmfirewall; print('LLMFirewall Version:', llmfirewall.__version__)"
      - name: Validate Example Policy-as-Code Documents
        run: |
          test_env/bin/llmfirewall policy validate policies/default.json
          test_env/bin/llmfirewall policy validate policies/strict.json
          test_env/bin/llmfirewall policy validate policies/privacy.json
      - name: Run CLI Subcommand Verification Tests
        run: |
          test_env/bin/llmfirewall --version
          test_env/bin/llmfirewall scan "Hello World"
          test_env/bin/llmfirewall protect "Safe user prompt"
          test_env/bin/llmfirewall inventory list
          test_env/bin/llmfirewall risk
          test_env/bin/llmfirewall incidents list
      - name: Run AI Security Evaluation Engine
        run: |
          test_env/bin/llmfirewall eval run --format sarif --output eval_report.sarif
